name: Build ReadLoop APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The signing key lives in repository secrets, never in the repo.
      # Decoded to $RUNNER_TEMP so it is not part of the checked-out tree.
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.READLOOP_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::READLOOP_KEYSTORE_BASE64 secret is missing."
            echo "Generate a keystore, base64 it, and add it as a repository secret."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/readloop.jks"
          echo "READLOOP_KEYSTORE_FILE=$RUNNER_TEMP/readloop.jks" >> "$GITHUB_ENV"

      # The hosted runner already has the Android SDK. Just make sure the
      # exact platform + build-tools this project needs are present.
      - name: Install Android SDK packages
        run: |
          set -e
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed release APK
        env:
          READLOOP_KEYSTORE_PASSWORD: ${{ secrets.READLOOP_KEYSTORE_PASSWORD }}
          READLOOP_KEY_ALIAS: ${{ secrets.READLOOP_KEY_ALIAS }}
          READLOOP_KEY_PASSWORD: ${{ secrets.READLOOP_KEY_PASSWORD }}
          READLOOP_BUILD_NUMBER: ${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK is signed
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$BT/apksigner" verify --print-certs "$APK"

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/ReadLoop.apk
          ls -lh out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReadLoop-apk
          path: out/ReadLoop.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ReadLoop build ${{ github.run_number }}
          body: |
            Automatic build of `${{ github.sha }}`

            Download **ReadLoop.apk** below and install it on your phone.
          files: out/ReadLoop.apk
